<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMS Board · 短信接收面板</title>
<link rel="stylesheet" href="/static/style.css?v=20250605" />
<!-- 首屏前确定主题（默认浅色，遵循上次选择） -->
<script>
(function () {
  try {
    var t = localStorage.getItem("sb-theme");
    if (!t) t = "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app" v-cloak>

  <!-- ===== 顶部 ===== -->
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">📨</div>
      <div>
        <h1>SMS Board <small>短信接收面板</small></h1>
        <p class="sub">SmsForwarder → Webhook → 实时面板</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" :class="connOn ? 'on' : 'off'"><i class="dot"></i>{{ connText }}</span>
      <button class="icon-btn" title="刷新（重载历史与统计）" @click="refreshAll">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== 统计面板 ===== -->
  <section class="stats" aria-label="统计">
    <div class="stat" v-for="sc in statCards" :key="sc.label">
      <div class="stat-icon" :style="{ color: sc.color }" v-html="sc.icon" aria-hidden="true"></div>
      <div class="stat-val">{{ sc.value }}</div>
      <div class="stat-label">{{ sc.label }}</div>
    </div>
  </section>
  <div v-if="stats && stats.senders && stats.senders.length" class="chips">
    <span class="chips-label">热门发件人</span>
    <button v-for="(s, i) in topSenders" :key="s.from_number + '-' + i" class="chip" :title="'筛选：' + (s.from_number || s.contact_name || '未知')" @click="filterKw = s.from_number || s.contact_name">
      {{ s.contact_name || s.from_number || '未知' }} <b>{{ s.count }}</b>
    </button>
  </div>

  <!-- ===== 工具栏 ===== -->
  <section class="toolbar">
    <input v-model="filterKw" class="search" type="search" placeholder="🔍 搜索号码 / 联系人 / 内容 / 验证码" />
    <input v-model="tokenInput" class="token" placeholder="访问 Token（可选）" @change="onTokenChange" />
    <span class="spacer"></span>
    <button class="icon-btn" :title="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'" @click="toggleTheme">
      <svg v-if="theme === 'dark'" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg v-else viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="icon-btn" :class="{ active: soundOn }" :title="soundOn ? '关闭新消息提示音' : '开启新消息提示音'" @click="soundOn = !soundOn">
      <svg v-if="soundOn" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg v-else viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <button class="icon-btn" :class="{ active: notifOn }" :title="notifOn ? '关闭桌面通知' : '开启桌面通知'" @click="toggleNotif">
      <svg v-if="notifOn" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <svg v-else viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <button class="btn danger" @click="showClear = true" title="删除服务端全部短信记录">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      清空数据
    </button>
  </section>

  <!-- ===== 消息列表 ===== -->
  <main class="list">
    <div v-if="loading" class="empty">
      <div class="big">⏳</div>
      <p class="hint">正在加载历史消息…</p>
    </div>

    <template v-else>
      <div v-if="groupList.length === 0" class="empty">
        <div class="big">{{ total > 0 ? '🔎' : '📭' }}</div>
        <p><b>{{ total > 0 ? '没有匹配的消息' : '还没有收到短信' }}</b></p>
        <p class="hint">{{ total > 0 ? '换个关键词试试' : '等待 SmsForwarder 推送…（POST /v1/sms/receive）' }}</p>
      </div>

      <section v-for="g in groupList" :key="g.key" class="group">
        <header class="group-head" @click="groupOpen[g.key] = !(groupOpen[g.key] ?? true)">
          <div class="avatar" :style="{ background: g.color }">{{ g.initial }}</div>
          <div class="g-meta">
            <div class="g-name">
              <code class="g-num">{{ g.number || '发件人' }}</code>
              <span v-if="g.contact_name" class="g-cn">{{ g.contact_name }}</span>
            </div>
            <div class="g-sub">{{ g.count }} 条 · {{ g.lastTime || '未知时间' }}</div>
          </div>
          <span class="chev" :class="{ open: (groupOpen[g.key] ?? true) }">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </header>

        <Transition name="expand">
          <div v-if="groupOpen[g.key] ?? true" class="messages">
            <TransitionGroup name="msg">
              <article v-for="m in g.list" :key="m.id" class="msg">
                <div class="msg-top">
                  <div class="badges">
                    <span v-if="m.code" class="badge code">🔑 {{ m.code }}</span>
                    <span v-if="m.sim_slot" class="badge">📶 {{ m.sim_slot }}</span>
                    <span v-if="m.phone_area" class="badge">📍 {{ m.phone_area }}</span>
                    <span v-if="m.device_name" class="badge">📱 {{ m.device_name }}</span>
                  </div>
                  <time>{{ m.receive_time || m.created_at || '' }}</time>
                </div>
                <p class="msg-content" v-html="highlight(m.content, m.code)"></p>
                <div class="msg-actions">
                  <button v-if="m.code" class="btn mini copy" @click="copyText(m.code, m.id)">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    {{ copiedId === m.id ? '已复制 ✓' : '复制验证码' }}
                  </button>
                  <button class="btn mini del" :class="{ confirm: deletingId === m.id }" @click="askDelete(m)">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    {{ deletingId === m.id ? '确认删除？' : '删除' }}
                  </button>
                </div>
              </article>
            </TransitionGroup>
          </div>
        </Transition>
      </section>

      <button v-if="hasMore" class="load-more" :disabled="loadingMore" @click="loadMore">
        {{ loadingMore ? '加载中…' : '加载更早的消息（共 ' + total + ' 条）' }}
      </button>
    </template>
  </main>

  <footer class="foot">
    <span>实时推送：SSE</span> · <span>接收端点 <code>POST /v1/sms/receive</code></span> · <span>共 {{ total ?? '-' }} 条</span>
  </footer>

  <!-- ===== 清空确认 ===== -->
  <Transition name="fade">
    <div v-if="showClear" class="mask" @click.self="showClear = false">
      <div class="modal" role="dialog" aria-label="清空确认">
        <h3>清空全部数据？</h3>
        <p>将删除服务端存储的 <b>全部 {{ total ?? 0 }} 条</b> 短信记录，此操作<b>无法恢复</b>，且对所有打开的页面生效。</p>
        <div class="modal-actions">
          <button class="btn" @click="showClear = false">取消</button>
          <button class="btn danger" :disabled="clearing" @click="doClear">{{ clearing ? '清空中…' : '确认清空' }}</button>
        </div>
      </div>
    </div>
  </Transition>

  <!-- ===== Toast ===== -->
  <Transition name="toast">
    <div v-if="toast" class="toast">{{ toast }}</div>
  </Transition>
</div>

<script type="module" src="/static/app.js?v=20250605"></script>
</body>
</html>
